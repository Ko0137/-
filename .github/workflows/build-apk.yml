name: Build Pure Native Android APK (Java + XML)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: 🔧 Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "=== BUILD FAILED ==="
            echo "--- Compilation and Build Errors ---"
            grep -i -E "error:|compile|exception|fail" build.log | head -n 150 || true
            echo "--- Last 200 lines of log ---"
            tail -n 200 build.log
            exit 1
          }

      - name: 📤 Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIRA-Native-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

